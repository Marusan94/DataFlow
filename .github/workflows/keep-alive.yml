name: keep-alive-render

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render para evitar sleep (free tier)
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://eduanalytics.onrender.com/)
          echo "Render HTTP $CODE"
          [ "$CODE" = "200" ] || exit 1
